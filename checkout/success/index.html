<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#050505" name="theme-color"/>
<title>Оплата принята — Беспалова и партнеры</title>
<style>
:root {
  --black: #050505;
  --text: #f4f1eb;
  --muted: #b9b6b0;
  --gold-pale: #d7b27c;
  --max: 720px;
}
* { box-sizing: border-box; }
html { background: var(--black); }
body {
  margin: 0;
  min-width: 320px;
  background: var(--black);
  color: var(--text);
  font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
}
a { color: var(--gold-pale); }
.wrap { width: min(100%, var(--max)); margin: 0 auto; padding: 72px 22px; }
h1 { margin: 0 0 18px; font-weight: 300; font-size: clamp(32px, 6vw, 48px); }
p { color: var(--muted); line-height: 1.75; }
.links { display: flex; gap: 22px; margin-top: 32px; font-size: 12px; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Оплата принята</h1>
  <p>Платёж получен. Повторная оплата не требуется. Доступ к материалам появится после проверки заказа администратором. Когда доступ будет предоставлен, на указанный email придёт письмо со способом входа в личный кабинет.</p>
  <div class="links">
    <a href="/account">ЛИЧНЫЙ КАБИНЕТ</a>
    <a href="/">НА ГЛАВНУЮ</a>
  </div>
</div>
</body>
</html>
