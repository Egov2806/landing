<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#050505" name="theme-color"/>
<meta content="Оформление заказа — Беспалова и партнеры" name="description"/>
<title>Оформление заказа — Беспалова и партнеры</title>
<style>
:root {
  --black: #050505;
  --text: #f4f1eb;
  --muted: #b9b6b0;
  --gold: #b98449;
  --gold-pale: #d7b27c;
  --line-soft: rgba(255, 255, 255, .08);
  --max: 820px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
* { box-sizing: border-box; }
html { background: var(--black); }
body {
  margin: 0;
  min-width: 320px;
  background: var(--black);
  color: var(--text);
  font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
.wrap { width: min(100%, var(--max)); margin: 0 auto; padding: 36px 22px 80px; }
.top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 42px;
}
.brand { letter-spacing: .18em; font-size: 13px; }
.brand small { display: block; margin-top: 8px; color: var(--gold-pale); font-size: 10px; letter-spacing: .28em; }
.top-links { display: flex; gap: 18px; font-size: 11px; letter-spacing: .08em; color: #d9d5cf; }
.top-links a:hover { color: var(--gold-pale); }
h1 { margin: 0 0 12px; font-weight: 300; font-size: clamp(34px, 6vw, 52px); }
.lead { margin: 0 0 36px; color: var(--muted); line-height: 1.7; }
.panel {
  border: 1px solid var(--line-soft);
  background: #0d0d0c;
  padding: 28px 24px;
  margin-bottom: 28px;
}
.checkout-item {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line-soft);
}
.checkout-item h3 { margin: 0; font-size: 17px; font-weight: 400; }
.checkout-item strong { color: var(--gold-pale); font-weight: 400; }
.total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  font-size: 12px;
  letter-spacing: .16em;
  color: #8d8982;
}
.total strong { color: var(--gold-pale); font-size: 26px; font-weight: 300; letter-spacing: 0; }
form { display: grid; gap: 22px; }
label { display: flex; flex-direction: column; gap: 8px; }
label > span { color: #817e78; font-size: 9px; letter-spacing: .17em; }
input[type="text"], input[type="email"], input[type="tel"] {
  width: 100%;
  border: 0;
  border-bottom: 1px solid #3d3b37;
  background: transparent;
  padding: 12px 0;
  outline: none;
}
input:focus { border-color: var(--gold); }
.consent { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; color: #b9b6b0; line-height: 1.5; }
.consent input { margin-top: 3px; }
.button {
  border: 0;
  min-height: 52px;
  padding: 0 24px;
  cursor: pointer;
  letter-spacing: .12em;
  font-size: 12px;
}
.button:disabled { opacity: .45; cursor: not-allowed; }
.button-gold { background: linear-gradient(90deg, #b88749 0%, #c69757 100%); color: #fff; }
.checkout-message { min-height: 22px; color: var(--gold-pale); font-size: 14px; }
.checkout-message.error { color: #d67b72; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">БЕСПАЛОВА И ПАРТНЕРЫ<small>ЮРИДИЧЕСКИЙ БУТИК</small></a>
    <div class="top-links">
      <a href="/#products">КАТАЛОГ</a>
      <a href="/account">ЛИЧНЫЙ КАБИНЕТ</a>
    </div>
  </div>
  <h1>Оформление заказа</h1>
  <p class="lead">Проверьте состав заказа и укажите контактные данные. Сумма рассчитывается на сервере. Доступ к материалам появится после подтверждения оплаты и выдачи администратором.</p>

  <div class="panel">
    <div id="checkoutItems"></div>
    <div class="total"><span>ИТОГО</span><strong id="checkoutTotal">0 ₽</strong></div>
  </div>

  <form id="checkoutForm" novalidate>
    <label>
      <span>ВАШЕ ИМЯ</span>
      <input autocomplete="name" id="checkoutName" name="name" required type="text"/>
    </label>
    <label>
      <span>EMAIL</span>
      <input autocomplete="email" id="checkoutEmail" name="email" required type="email"/>
    </label>
    <label>
      <span>ТЕЛЕФОН</span>
      <input autocomplete="tel" id="checkoutPhone" inputmode="tel" maxlength="18" minlength="7" name="phone" pattern="\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}" placeholder="+7 (___) ___-__-__" required type="tel"/>
    </label>
    <label class="consent">
      <input id="consentPersonal" name="consent_personal_data" required type="checkbox"/>
      <span>Согласен(на) на обработку персональных данных</span>
    </label>
    <label class="consent">
      <input id="consentOffer" name="consent_offer" required type="checkbox"/>
      <span>Принимаю оферту и политику конфиденциальности</span>
    </label>
    <button class="button button-gold" disabled id="payButton" type="submit">ОПЛАТИТЬ</button>
    <div aria-live="polite" class="checkout-message" id="checkoutMessage" role="status"></div>
  </form>
</div>
<script src="/assets/js/config.uat.js?v=20260907-co"></script>
<script src="/assets/js/api-client.js?v=20260907-co"></script>
<script src="/assets/js/cart-store.js?v=20260907-co"></script>
<script src="/assets/js/checkout.js?v=20260918-g2"></script>
</body>
</html>
