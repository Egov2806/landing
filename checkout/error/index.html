<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="#050505" name="theme-color"/>
<title>Оплата не завершена — Беспалова и партнеры</title>
<style>
:root {
  --black: #050505;
  --text: #f4f1eb;
  --muted: #b9b6b0;
  --gold-pale: #d7b27c;
  --line-soft: rgba(255, 255, 255, .08);
  --max: 820px;
}
* { box-sizing: border-box; }
html { background: var(--black); }
body {
  margin: 0;
  min-width: 320px;
  background: var(--black);
  color: var(--text);
  font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
}
a { color: inherit; text-decoration: none; }
.wrap { width: min(100%, var(--max)); margin: 0 auto; padding: 36px 22px 80px; }
.top { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 42px; }
.brand { letter-spacing: .18em; font-size: 13px; }
.brand small { display: block; margin-top: 8px; color: var(--gold-pale); font-size: 10px; letter-spacing: .28em; }
.top-links { display: flex; gap: 18px; font-size: 11px; letter-spacing: .08em; color: #d9d5cf; }
.top-links a:hover { color: var(--gold-pale); }
h1 { margin: 0 0 12px; font-weight: 300; font-size: clamp(34px, 6vw, 52px); }
.lead { margin: 0 0 28px; color: var(--muted); line-height: 1.75; }
.panel { border: 1px solid var(--line-soft); background: #0d0d0c; padding: 28px 24px; }
.links { display: flex; gap: 22px; margin-top: 32px; font-size: 12px; letter-spacing: .1em; }
.links a { color: var(--gold-pale); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">БЕСПАЛОВА И ПАРТНЕРЫ<small>ЮРИДИЧЕСКИЙ БУТИК</small></a>
    <div class="top-links">
      <a href="/#products">КАТАЛОГ</a>
      <a href="/account">ЛИЧНЫЙ КАБИНЕТ</a>
    </div>
  </div>
  <h1>Оплата не завершена</h1>
  <div class="panel">
    <p class="lead">Платёж не подтверждён. Доступ к материалам не выдан, повторное списание не выполняется.</p>
    <p class="lead">Можно вернуться к заказу и попробовать ещё раз или написать нам, если деньги всё же списались.</p>
  </div>
  <div class="links">
    <a href="/checkout/">ВЕРНУТЬСЯ К ЗАКАЗУ</a>
    <a href="/">НА ГЛАВНУЮ</a>
  </div>
</div>
</body>
</html>
