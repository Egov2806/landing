server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location ^~ /lk {
        location = /lk {
            return 301 /lk/;
        }

        location /lk/ {
            try_files $uri $uri/ /lk/index.html;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }
}
